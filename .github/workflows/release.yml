name: Release

# Tagging v* builds the daemon and publishes it as a release asset, so users
# do not need a Swift toolchain to install.
#
# Apple Silicon only. The runner (macos-14) is arm64 and a plain
# `swift build -c release` puts the binary at a predictable .build/release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          uname -m

      - name: Build
        run: swift build -c release

      - name: Verify the binary
        run: |
          BIN=.build/release/arctis-audioswitch
          file "$BIN"
          lipo -info "$BIN"
          # Fail loudly rather than shipping an asset for the wrong arch.
          lipo -info "$BIN" | grep -q 'arm64' || {
            echo "expected an arm64 binary" >&2; exit 1; }
          "$BIN" --version
          "$BIN" --help > /dev/null

      - name: Assemble tarball
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${TAG#v}"
          STAGE="arctis-audioswitch-${VERSION}"

          mkdir -p "$STAGE/bin" "$STAGE/build"
          # bin/arctis resolves its own location and falls back to build/,
          # so this layout works straight out of the tarball.
          cp .build/release/arctis-audioswitch "$STAGE/build/arctis-audioswitch"
          cp bin/arctis "$STAGE/bin/arctis"
          cp teardown.sh README.md LICENSE RESOURCES.md "$STAGE/"
          chmod +x "$STAGE/bin/arctis" "$STAGE/teardown.sh" \
                   "$STAGE/build/arctis-audioswitch"

          ASSET="${STAGE}-macos-arm64.tar.gz"
          tar -czf "$ASSET" "$STAGE"
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Smoke-test the tarball
        run: |
          # Catches a layout mistake before anyone downloads it. The daemon
          # itself needs the hardware, so only check the CLI wiring.
          TMP="$(mktemp -d)"
          tar -xzf "$ASSET" -C "$TMP"
          EXTRACTED="$(find "$TMP" -maxdepth 1 -type d -name 'arctis-audioswitch-*')"
          "$EXTRACTED/bin/arctis" --help > /dev/null
          test -x "$EXTRACTED/build/arctis-audioswitch"
          echo "tarball layout OK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          gh release create "$TAG" \
            "$ASSET" "$ASSET.sha256" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
